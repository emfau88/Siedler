<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siedler Game - Modular V3</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div id="resourceBar" class="ui-element">
            <div class="resource">
                <div class="resource-icon wood"></div>
                <span id="woodCount">150</span>
            </div>
            <div class="resource">
                <div class="resource-icon stone"></div>
                <span id="stoneCount">50</span>
            </div>
            <div class="resource">
                <div class="resource-icon food"></div>
                <span id="foodCount">100</span>
            </div>
            <div class="resource">
                <div class="resource-icon pop"></div>
                <span id="popCount">0/5</span>
            </div>
        </div>
        
        <div id="minimapContainer" class="ui-element">
            <canvas id="minimap" width="100" height="100"></canvas>
        </div>
        
        <!-- Baumenü (wird bei Auswahl ausgeblendet) -->
        <div id="buildMenu" class="ui-element">
            <div class="build-item" data-building="lumberjack" data-cost="wood:40,stone:10">
                <div class="build-icon">🪓</div>
                <div class="build-size">2×2</div>
                <div>Holz</div>
                <div class="build-cost">🪵40🪨10</div>
            </div>
            <div class="build-item" data-building="stonemason" data-cost="wood:50,stone:0">
                <div class="build-icon">⛏️</div>
                <div class="build-size">2×2</div>
                <div>Stein</div>
                <div class="build-cost">🪵50</div>
            </div>
            <div class="build-item" data-building="farm" data-cost="wood:50,stone:20">
                <div class="build-icon">🌾</div>
                <div class="build-size">2×2</div>
                <div>Farm</div>
                <div class="build-cost">🪵50🪨20</div>
            </div>
            <div class="build-item" data-building="house" data-cost="wood:30,stone:20">
                <div class="build-icon">🏠</div>
                <div class="build-size">2×2</div>
                <div>Haus</div>
                <div class="build-cost">🪵30🪨20</div>
            </div>
            <div class="build-item" data-building="barracks" data-cost="wood:80,stone:50">
                <div class="build-icon">⚔️</div>
                <div class="build-size">3×3</div>
                <div>Armee</div>
                <div class="build-cost">🪵80🪨50</div>
            </div>
        </div>
        
        <button id="buildMenuBtn" class="ui-element">🔨</button>
        <button id="cancelBuildBtn" class="ui-element">✕</button>
        
        <div id="zoomControls">
            <button class="zoomBtn" id="zoomIn">+</button>
            <button class="zoomBtn" id="zoomOut">−</button>
        </div>
        
        <div id="info">
            🖱️ Ziehen = Kamera<br>
            🔨 = Bauen | ✕ = Abbrechen<br>
            <b>R</b> = +100 Holz | <b>S</b> = +50 Stein
        </div>
        
        <div id="buildStatus">
            <div id="buildStatusText">Wähle eine Position</div>
            <div style="font-size: 12px; margin-top: 5px; color: #aaa;">Tippen zum Bauen</div>
        </div>
        
        <div id="cheatInfo">Cheat aktiviert!</div>
    </div>

    <!-- Module laden -->
    <script src="js/config.js"></script>
    <script src="js/resources.js"></script>
    <script src="js/map.js"></script>
    <script src="js/buildings.js"></script>
    <script src="js/settlers.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
