<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siedler Game - Große Gebäude (2x2/3x3)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #gameCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #uiLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .ui-element {
            pointer-events: auto;
        }
        
        #resourceBar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #8b4513;
            border-radius: 8px;
            padding: 8px 20px;
            display: flex;
            gap: 25px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        
        .resource {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .resource-icon {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }
        
        .wood { background: #8b4513; }
        .stone { background: #808080; }
        .food { background: #ffd700; }
        .pop { background: #4169e1; }
        
        #minimapContainer {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #8b4513;
            border-radius: 8px;
            padding: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        
        #minimap {
            width: 100px;
            height: 100px;
            background: #2d5016;
            border: 1px solid #555;
            display: block;
        }
        
        #buildMenuBtn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: rgba(139, 69, 19, 0.9);
            border: 3px solid #d2691e;
            border-radius: 12px;
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        
        #buildMenuBtn:active {
            transform: scale(0.95);
        }
        
        #buildMenuBtn.active {
            background: rgba(210, 105, 30, 0.9);
            border-color: #ff8c00;
        }
        
        #buildMenu {
            position: absolute;
            bottom: 90px;
            right: 20px;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #8b4513;
            border-radius: 12px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(2, 85px);
            grid-template-rows: repeat(2, 90px);
            gap: 8px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.7);
        }
        
        #buildMenu.active {
            display: grid;
        }
        
        .build-item {
            background: rgba(139, 69, 19, 0.6);
            border: 2px solid #d2691e;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .build-item:hover {
            background: rgba(139, 69, 19, 0.9);
            transform: scale(1.05);
        }
        
        .build-item.selected {
            background: rgba(255, 140, 0, 0.9);
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .build-icon {
            font-size: 24px;
            margin-bottom: 2px;
        }
        
        .build-size {
            font-size: 9px;
            color: #aaa;
            margin-bottom: 2px;
        }
        
        .build-cost {
            font-size: 9px;
            color: #ddd;
        }
        
        #zoomControls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .zoomBtn {
            width: 50px;
            height: 50px;
            font-size: 24px;
            background: rgba(0,0,0,0.85);
            color: white;
            border: 2px solid #8b4513;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        
        .zoomBtn:active {
            background: rgba(100,100,100,0.8);
        }
        
        #info {
            position: absolute;
            top: 60px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 8px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
        }
        
        #buildInfo {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.9);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            border: 2px solid #d2691e;
            pointer-events: none;
        }
        
        #cheatInfo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
            display: none;
            border: 2px solid #0f0;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div id="resourceBar" class="ui-element">
            <div class="resource">
                <div class="resource-icon wood"></div>
                <span id="woodCount">150</span>
            </div>
            <div class="resource">
                <div class="resource-icon stone"></div>
                <span id="stoneCount">80</span>
            </div>
            <div class="resource">
                <div class="resource-icon food"></div>
                <span id="foodCount">100</span>
            </div>
            <div class="resource">
                <div class="resource-icon pop"></div>
                <span id="popCount">5/10</span>
            </div>
        </div>
        
        <div id="minimapContainer" class="ui-element">
            <canvas id="minimap" width="100" height="100"></canvas>
        </div>
        
        <button id="buildMenuBtn" class="ui-element">🔨</button>
        
        <div id="buildMenu" class="ui-element">
            <div class="build-item" data-building="lumberjack" data-cost="wood:40,stone:10">
                <div class="build-icon">🪓</div>
                <div class="build-size">2×2</div>
                <div>Holzfäller</div>
                <div class="build-cost">🪵40🪨10</div>
            </div>
            <div class="build-item" data-building="farm" data-cost="wood:50,stone:20">
                <div class="build-icon">🌾</div>
                <div class="build-size">2×2</div>
                <div>Farm</div>
                <div class="build-cost">🪵50🪨20</div>
            </div>
            <div class="build-item" data-building="house" data-cost="wood:30,stone:20">
                <div class="build-icon">🏠</div>
                <div class="build-size">2×2</div>
                <div>Haus</div>
                <div class="build-cost">🪵30🪨20</div>
            </div>
            <div class="build-item" data-building="barracks" data-cost="wood:80,stone:50">
                <div class="build-icon">⚔️</div>
                <div class="build-size">3×3</div>
                <div>Kaserne</div>
                <div class="build-cost">🪵80🪨50</div>
            </div>
        </div>
        
        <div id="zoomControls">
            <button class="zoomBtn" id="zoomIn">+</button>
            <button class="zoomBtn" id="zoomOut">−</button>
        </div>
        
        <div id="info">
            🖱️ Ziehen = Kamera | 🔨 = Bauen | <b>R</b> = +100 Holz (Cheat)
        </div>
        
        <div id="buildInfo">Klicke auf eine freie Gras-Fläche zum Bauen</div>
        <div id="cheatInfo">+100 Holz!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const MAP_WIDTH = 60;
        const MAP_HEIGHT = 45;
        const TILE_SIZE = 32;
        
        // GEBÄUDE mit tileSize (2 oder 3 für bessere Assets)
        const BUILDINGS = {
            hq: { 
                name: 'HQ', 
                color: '#8b0000', 
                tileSize: 3,        // 3x3 = 96x96px
                symbol: '🏰',
                workTile: { x: 1, y: 2 }  // Unten-mitte für Siedler
            },
            lumberjack: { 
                name: 'Holzfäller', 
                color: '#8b4513', 
                tileSize: 2,        // 2x2 = 64x64px
                symbol: '🪓',
                workTile: { x: 1, y: 1 }  // Rechts-unten
            },
            farm: { 
                name: 'Farm', 
                color: '#daa520', 
                tileSize: 2,        // 2x2 = 64x64px
                symbol: '🌾',
                workTile: { x: 0, y: 1 }  // Links-unten
            },
            house: { 
                name: 'Haus', 
                color: '#cd853f', 
                tileSize: 2,        // 2x2 = 64x64px
                symbol: '🏠',
                workTile: { x: 1, y: 1 }
            },
            barracks: { 
                name: 'Kaserne', 
                color: '#696969', 
                tileSize: 3,        // 3x3 = 96x96px
                symbol: '⚔️',
                workTile: { x: 1, y: 2 }
            }
        };
        
        let camera = {
            x: 0,
            y: 0,
            zoom: 1,
            minZoom: 0.5,
            maxZoom: 2
        };
        
        let map = [];
        let buildings = [];
        let settlers = [];
        let trees = [];
        let farmFields = [];
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let selectedBuilding = null;
        let mousePos = { x: 0, y: 0 };
        let isBuildMode = false;
        
        let resources = {
            wood: 150,
            stone: 80,
            food: 100,
            pop: 5,
            popMax: 10
        };
        
        let gameTime = 0;
        
        function initTrees() {
            trees = [];
            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let x = 0; x < MAP_WIDTH; x++) {
                    if (map[y][x] === 1) {
                        trees.push({ x: x, y: y, age: Math.random() * 60 });
                    }
                }
            }
        }
        
        function generateClusteredMap() {
            for (let y = 0; y < MAP_HEIGHT; y++) {
                map[y] = [];
                for (let x = 0; x < MAP_WIDTH; x++) {
                    map[y][x] = 0;
                }
            }
            
            let riverX = Math.floor(MAP_WIDTH * 0.3);
            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let w = 0; w < 2; w++) {
                    if (riverX + w < MAP_WIDTH) map[y][riverX + w] = 2;
                }
                if (Math.random() < 0.3) {
                    riverX += Math.random() < 0.5 ? 1 : -1;
                    riverX = Math.max(2, Math.min(MAP_WIDTH - 4, riverX));
                }
            }
            
            let tributaryY = Math.floor(MAP_HEIGHT * 0.4);
            for (let x = 0; x < MAP_WIDTH * 0.4; x++) {
                for (let w = 0; w < 2; w++) {
                    if (tributaryY + w < MAP_HEIGHT) map[tributaryY + w][x] = 2;
                }
                if (Math.random() < 0.25) {
                    tributaryY += Math.random() < 0.5 ? 1 : -1;
                    tributaryY = Math.max(2, Math.min(MAP_HEIGHT - 4, tributaryY));
                }
            }
            
            for (let l = 0; l < 2; l++) {
                const cx = Math.floor(Math.random() * (MAP_WIDTH - 10)) + 5;
                const cy = Math.floor(Math.random() * (MAP_HEIGHT - 10)) + 5;
                const radius = Math.floor(Math.random() * 3) + 2;
                
                for (let y = cy - radius; y <= cy + radius; y++) {
                    for (let x = cx - radius; x <= cx + radius; x++) {
                        if (y >= 0 && y < MAP_HEIGHT && x >= 0 && x < MAP_WIDTH) {
                            const dist = Math.sqrt((x-cx)**2 + (y-cy)**2);
                            if (dist <= radius + Math.random() * 0.5) map[y][x] = 2;
                        }
                    }
                }
            }
            
            for (let f = 0; f < 6; f++) {
                let fx = Math.floor(Math.random() * (MAP_WIDTH - 8)) + 4;
                let fy = Math.floor(Math.random() * (MAP_HEIGHT - 8)) + 4;
                if (map[fy][fx] === 2) continue;
                
                const forestSize = Math.floor(Math.random() * 30) + 15;
                const queue = [{x: fx, y: fy}];
                let placed = 0;
                const visited = new Set();
                
                while (queue.length > 0 && placed < forestSize) {
                    const current = queue.shift();
                    const key = `${current.x},${current.y}`;
                    if (visited.has(key)) continue;
                    visited.add(key);
                    
                    if (current.x < 0 || current.x >= MAP_WIDTH || 
                        current.y < 0 || current.y >= MAP_HEIGHT) continue;
                    if (map[current.y][current.x] === 2) continue;
                    
                    const distToCenter = Math.sqrt((current.x - fx)**2 + (current.y - fy)**2);
                    const prob = Math.max(0.3, 1 - distToCenter / 5);
                    
                    if (Math.random() < prob) {
                        map[current.y][current.x] = 1;
                        placed++;
                        
                        const neighbors = [
                            {x: current.x+1, y: current.y},
                            {x: current.x-1, y: current.y},
                            {x: current.x, y: current.y+1},
                            {x: current.x, y: current.y-1}
                        ];
                        
                        for (const n of neighbors) {
                            if (!visited.has(`${n.x},${n.y}`)) queue.push(n);
                        }
                    }
                }
            }
        }
        
        // WICHTIG: Prüft tileSize x tileSize Bereich
        function canBuildHere(tileX, tileY, buildingType) {
            const building = BUILDINGS[buildingType];
            const size = building.tileSize;
            
            for (let dy = 0; dy < size; dy++) {
                for (let dx = 0; dx < size; dx++) {
                    const checkX = tileX + dx;
                    const checkY = tileY + dy;
                    
                    if (checkX < 0 || checkX >= MAP_WIDTH || checkY < 0 || checkY >= MAP_HEIGHT) {
                        return false;
                    }
                    
                    if (map[checkY][checkX] !== 0) {
                        return false;
                    }
                    
                    // Prüfe Kollision mit anderen Gebäuden
                    for (const b of buildings) {
                        const bType = BUILDINGS[b.type];
                        if (checkX >= b.tileX && checkX < b.tileX + bType.tileSize &&
                            checkY >= b.tileY && checkY < b.tileY + bType.tileSize) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }
        
        function addBuilding(type, tileX, tileY) {
            const building = BUILDINGS[type];
            const newBuilding = {
                type: type,
                tileX: tileX,
                tileY: tileY,
                x: tileX * TILE_SIZE,
                y: tileY * TILE_SIZE,
                id: Date.now() + Math.random(),
                // Arbeits-Tile für Siedler (relativ zum Gebäude)
                workX: tileX + building.workTile.x,
                workY: tileY + building.workTile.y
            };
            buildings.push(newBuilding);
            
            if (type === 'farm') {
                farmFields.push({
                    buildingId: newBuilding.id,
                    stage: 0,
                    progress: 0,
                    lastUpdate: gameTime
                });
            }
            
            console.log('Gebäude gebaut:', type, 'Größe:', building.tileSize + 'x' + building.tileSize);
        }
        
        function placeHQ() {
            const centerX = Math.floor(MAP_WIDTH / 2);
            const centerY = Math.floor(MAP_HEIGHT / 2);
            
            // HQ ist 3x3, also etwas mehr Platz suchen
            for (let radius = 0; radius < 15; radius++) {
                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const x = centerX + dx;
                        const y = centerY + dy;
                        
                        if (canBuildHere(x, y, 'hq')) {
                            addBuilding('hq', x, y);
                            centerCameraOn(x + 1.5, y + 1.5); // Zentriere auf Mitte des 3x3
                            return;
                        }
                    }
                }
            }
        }
        
        function createSettler(startX, startY, job, targetX, targetY, carrying) {
            return {
                x: startX * TILE_SIZE + TILE_SIZE/2,
                y: startY * TILE_SIZE + TILE_SIZE/2,
                targetX: targetX * TILE_SIZE + TILE_SIZE/2,
                targetY: targetY * TILE_SIZE + TILE_SIZE/2,
                job: job,
                carrying: carrying || null,
                speed: 2,
                state: 'moving',
                buildingId: null
            };
        }
        
        function centerCameraOn(tileX, tileY) {
            camera.x = (canvas.width / 2) - (tileX * TILE_SIZE * camera.zoom);
            camera.y = (canvas.height / 2) - (tileY * TILE_SIZE * camera.zoom);
        }
        
        function centerCamera() {
            const mapPixelWidth = MAP_WIDTH * TILE_SIZE;
            const mapPixelHeight = MAP_HEIGHT * TILE_SIZE;
            camera.x = (canvas.width - mapPixelWidth) / 2;
            camera.y = (canvas.height - mapPixelHeight) / 2;
        }
        
        function screenToTile(screenX, screenY) {
            const tileX = Math.floor((screenX - camera.x) / (TILE_SIZE * camera.zoom));
            const tileY = Math.floor((screenY - camera.y) / (TILE_SIZE * camera.zoom));
            return { x: tileX, y: tileY };
        }
        
        function getHQ() {
            return buildings.find(b => b.type === 'hq');
        }
        
        // GAME LOGIC
        function updateGame() {
            gameTime++;
            
            const hq = getHQ();
            if (!hq) return;
            
            // Holzfäller-Logik mit workX/workY
            const lumberjacks = buildings.filter(b => b.type === 'lumberjack');
            for (const lumberjack of lumberjacks) {
                let worker = settlers.find(s => s.buildingId === lumberjack.id && s.job === 'lumberjack');
                
                if (!worker) {
                    const nearestTree = findNearestTree(lumberjack.workX, lumberjack.workY);
                    if (nearestTree && gameTime % 120 === 0) {
                        worker = createSettler(
                            lumberjack.workX, 
                            lumberjack.workY, 
                            'lumberjack',
                            nearestTree.x,
                            nearestTree.y,
                            null
                        );
                        worker.buildingId = lumberjack.id;
                        worker.targetTree = nearestTree;
                        settlers.push(worker);
                    }
                } else if (worker.state === 'moving' && worker.targetTree) {
                    const dx = worker.targetX - worker.x;
                    const dy = worker.targetY - worker.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < worker.speed) {
                        worker.state = 'working';
                        worker.workTimer = 60;
                    } else {
                        worker.x += (dx / dist) * worker.speed;
                        worker.y += (dy / dist) * worker.speed;
                    }
                } else if (worker.state === 'working') {
                    worker.workTimer--;
                    if (worker.workTimer <= 0) {
                        removeTree(worker.targetTree.x, worker.targetTree.y);
                        worker.carrying = 'wood';
                        worker.state = 'returning';
                        // Zurück zum HQ-Eingang (Mitte unten)
                        worker.targetX = (hq.tileX + 1.5) * TILE_SIZE;
                        worker.targetY = (hq.tileY + 2.5) * TILE_SIZE;
                    }
                } else if (worker.state === 'returning') {
                    const dx = worker.targetX - worker.x;
                    const dy = worker.targetY - worker.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < worker.speed) {
                        resources.wood += 10;
                        updateResourceDisplay();
                        settlers = settlers.filter(s => s !== worker);
                    } else {
                        worker.x += (dx / dist) * worker.speed;
                        worker.y += (dy / dist) * worker.speed;
                    }
                }
            }
            
            // Farm-Logik
            for (const field of farmFields) {
                field.progress++;
                
                if (field.stage === 0 && field.progress > 60) {
                    field.stage = 1;
                    field.progress = 0;
                } else if (field.stage === 1 && field.progress > 180) {
                    field.stage = 2;
                    field.progress = 0;
                } else if (field.stage === 2 && field.progress > 180) {
                    field.stage = 3;
                    field.progress = 0;
                }
                
                if (field.stage === 3 && gameTime % 60 === 0) {
                    const farm = buildings.find(b => b.id === field.buildingId);
                    if (farm) {
                        resources.food += 15;
                        field.stage = 0;
                        field.progress = 0;
                        updateResourceDisplay();
                        
                        // Visueller Carrier
                        const carrier = createSettler(
                            farm.workX, farm.workY, 'carrier',
                            hq.tileX + 1, hq.tileY + 2, 'food'
                        );
                        settlers.push(carrier);
                        setTimeout(() => {
                            settlers = settlers.filter(s => s !== carrier);
                        }, 1000);
                    }
                }
            }
            
            // Bäume nachwachsen
            if (gameTime % 3600 === 0) {
                regrowTrees();
            }
        }
        
        function findNearestTree(fromX, fromY) {
            let nearest = null;
            let minDist = Infinity;
            
            for (const tree of trees) {
                const dist = Math.sqrt((tree.x - fromX)**2 + (tree.y - fromY)**2);
                if (dist < minDist && dist < 12) {
                    minDist = dist;
                    nearest = tree;
                }
            }
            return nearest;
        }
        
        function removeTree(x, y) {
            trees = trees.filter(t => !(t.x === x && t.y === y));
            map[y][x] = 0;
        }
        
        function regrowTrees() {
            const candidates = [];
            for (let y = 1; y < MAP_HEIGHT - 1; y++) {
                for (let x = 1; x < MAP_WIDTH - 1; x++) {
                    if (map[y][x] === 0) {
                        const neighbors = [
                            map[y-1][x], map[y+1][x], map[y][x-1], map[y][x+1]
                        ];
                        if (neighbors.some(n => n === 1)) {
                            candidates.push({x, y});
                        }
                    }
                }
            }
            
            const count = Math.min(candidates.length, Math.floor(Math.random() * 3) + 3);
            for (let i = 0; i < count; i++) {
                if (candidates.length === 0) break;
                const idx = Math.floor(Math.random() * candidates.length);
                const pos = candidates.splice(idx, 1)[0];
                map[pos.y][pos.x] = 1;
                trees.push({x: pos.x, y: pos.y, age: 0});
            }
        }
        
        // DRAW FUNCTIONS
        function drawTile(x, y, type) {
            const screenX = camera.x + x * TILE_SIZE * camera.zoom;
            const screenY = camera.y + y * TILE_SIZE * camera.zoom;
            const size = TILE_SIZE * camera.zoom;
            
            if (screenX + size < 0 || screenX > canvas.width ||
                screenY + size < 0 || screenY > canvas.height) return;
            
            switch(type) {
                case 0: ctx.fillStyle = '#7cb342'; break;
                case 1: ctx.fillStyle = '#1b5e20'; break;
                case 2: ctx.fillStyle = '#1565c0'; break;
            }
            
            ctx.fillRect(screenX, screenY, size, size);
            
            if (type === 1 && size > 10) {
                ctx.fillStyle = '#2e7d32';
                ctx.fillRect(screenX + size*0.2, screenY + size*0.2, size*0.6, size*0.6);
            }
            
            if (camera.zoom > 0.8) {
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.lineWidth = 1;
                ctx.strokeRect(screenX, screenY, size, size);
            }
        }
        
        // ZEICHNE GROSSES GEBÄUDE (2x2 oder 3x3)
        function drawBuilding(building) {
            const b = BUILDINGS[building.type];
            const screenX = camera.x + building.x * camera.zoom;
            const screenY = camera.y + building.y * camera.zoom;
            const size = TILE_SIZE * b.tileSize * camera.zoom;
            
            if (screenX + size < 0 || screenX > canvas.width ||
                screenY + size < 0 || screenY > canvas.height) return;
            
            // Gebäude-Grundfläche
            ctx.fillStyle = b.color;
            ctx.fillRect(screenX + 2, screenY + 2, size - 4, size - 4);
            
            // 3D-Schatten
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(screenX + 4, screenY + size - 8, size - 8, 6);
            
            // Gitter für "Baustellen"-Look (später durch Asset ersetzen)
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1;
            for (let i = 1; i < b.tileSize; i++) {
                const linePos = i * TILE_SIZE * camera.zoom;
                ctx.beginPath();
                ctx.moveTo(screenX + linePos, screenY);
                ctx.lineTo(screenX + linePos, screenY + size);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(screenX, screenY + linePos);
                ctx.lineTo(screenX + size, screenY + linePos);
                ctx.stroke();
            }
            
            // Symbol in der Mitte
            if (size > 30) {
                ctx.font = `${Math.floor(size * 0.4)}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.symbol, screenX + size/2, screenY + size/2);
            }
            
            // Rahmen
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.strokeRect(screenX + 2, screenY + 2, size - 4, size - 4);
            
            // Arbeits-Tile markieren (für Debug, später ausblenden)
            if (camera.zoom > 1) {
                const workScreenX = camera.x + building.workX * TILE_SIZE * camera.zoom;
                const workScreenY = camera.y + building.workY * TILE_SIZE * camera.zoom;
                const tileSize = TILE_SIZE * camera.zoom;
                ctx.fillStyle = 'rgba(255,255,0,0.3)';
                ctx.fillRect(workScreenX, workScreenY, tileSize, tileSize);
            }
            
            // Farm-Wachstums-Anzeige
            if (building.type === 'farm') {
                const field = farmFields.find(f => f.buildingId === building.id);
                if (field) {
                    const barWidth = size - 8;
                    const barHeight = 6;
                    const progress = field.stage === 0 ? 0 : 
                                   field.stage === 3 ? 1 : 
                                   field.progress / 180;
                    
                    ctx.fillStyle = '#333';
                    ctx.fillRect(screenX + 4, screenY - 10, barWidth, barHeight);
                    
                    const colors = ['#8b4513', '#ffd700', '#7cb342', '#ff6b6b'];
                    ctx.fillStyle = colors[field.stage];
                    ctx.fillRect(screenX + 4, screenY - 10, barWidth * progress, barHeight);
                }
            }
        }
        
        function drawSettler(settler) {
            const screenX = camera.x + settler.x * camera.zoom;
            const screenY = camera.y + settler.y * camera.zoom;
            const size = Math.max(4, 8 * camera.zoom);
            
            if (screenX < -10 || screenX > canvas.width + 10 ||
                screenY < -10 || screenY > canvas.height + 10) return;
            
            // Siedler als brauner Punkt
            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
            ctx.fill();
            
            // Weißer Rand für Sichtbarkeit
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            if (settler.carrying) {
                ctx.fillStyle = settler.carrying === 'wood' ? '#8b4513' : '#ffd700';
                ctx.fillRect(screenX - size, screenY - size*3, size*2, size*1.5);
            }
        }
        
        // VORSCHAU für große Gebäude
        function drawBuildPreview() {
            if (!selectedBuilding) return;
            
            const tile = screenToTile(mousePos.x, mousePos.y);
            const building = BUILDINGS[selectedBuilding];
            const canBuild = canBuildHere(tile.x, tile.y, selectedBuilding);
            
            const screenX = camera.x + tile.x * TILE_SIZE * camera.zoom;
            const screenY = camera.y + tile.y * TILE_SIZE * camera.zoom;
            const size = TILE_SIZE * building.tileSize * camera.zoom;
            
            // Halbtransparentes Overlay für alle Tiles
            ctx.fillStyle = canBuild ? 'rgba(0,255,0,0.2)' : 'rgba(255,0,0,0.2)';
            ctx.fillRect(screenX, screenY, size, size);
            
            // Einzelne Tiles markieren
            for (let dy = 0; dy < building.tileSize; dy++) {
                for (let dx = 0; dx < building.tileSize; dx++) {
                    const tx = screenX + dx * TILE_SIZE * camera.zoom;
                    const ty = screenY + dy * TILE_SIZE * camera.zoom;
                    const ts = TILE_SIZE * camera.zoom;
                    
                    ctx.strokeStyle = canBuild ? '#0f0' : '#f00';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(tx, ty, ts, ts);
                }
            }
            ctx.setLineDash([]);
            
            // Gesamt-Rahmen
            ctx.strokeStyle = canBuild ? '#0f0' : '#f00';
            ctx.lineWidth = 3;
            ctx.strokeRect(screenX, screenY, size, size);
        }
        
        function drawMap() {
            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let x = 0; x < MAP_WIDTH; x++) {
                    drawTile(x, y, map[y][x]);
                }
            }
        }
        
        function drawMapBorder() {
            const mapPixelWidth = MAP_WIDTH * TILE_SIZE * camera.zoom;
            const mapPixelHeight = MAP_HEIGHT * TILE_SIZE * camera.zoom;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.strokeRect(camera.x, camera.y, mapPixelWidth, mapPixelHeight);
        }
        
        function drawMinimap() {
            const scaleX = minimapCanvas.width / MAP_WIDTH;
            const scaleY = minimapCanvas.height / MAP_HEIGHT;
            
            minimapCtx.fillStyle = '#1a1a1a';
            minimapCtx.fillRect(0, 0, 100, 100);
            
            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let x = 0; x < MAP_WIDTH; x++) {
                    switch(map[y][x]) {
                        case 0: minimapCtx.fillStyle = '#7cb342'; break;
                        case 1: minimapCtx.fillStyle = '#1b5e20'; break;
                        case 2: minimapCtx.fillStyle = '#1565c0'; break;
                    }
                    minimapCtx.fillRect(x * scaleX, y * scaleY, scaleX, scaleY);
                }
            }
            
            // Gebäude als Rechtecke (größer für bessere Sichtbarkeit)
            for (const b of buildings) {
                const building = BUILDINGS[b.type];
                minimapCtx.fillStyle = building.color;
                minimapCtx.fillRect(
                    b.tileX * scaleX, 
                    b.tileY * scaleY, 
                    scaleX * building.tileSize, 
                    scaleY * building.tileSize
                );
            }
            
            const viewX = (-camera.x / (MAP_WIDTH * TILE_SIZE * camera.zoom)) * 100;
            const viewY = (-camera.y / (MAP_HEIGHT * TILE_SIZE * camera.zoom)) * 100;
            const viewW = (canvas.width / (MAP_WIDTH * TILE_SIZE * camera.zoom)) * 100;
            const viewH = (canvas.height / (MAP_HEIGHT * TILE_SIZE * camera.zoom)) * 100;
            
            minimapCtx.strokeStyle = '#ff0000';
            minimapCtx.lineWidth = 2;
            minimapCtx.strokeRect(viewX, viewY, viewW, viewH);
        }
        
        function render() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawMap();
            
            for (const b of buildings) {
                drawBuilding(b);
            }
            
            for (const s of settlers) {
                drawSettler(s);
            }
            
            drawBuildPreview();
            drawMapBorder();
            drawMinimap();
        }
        
        function gameLoop() {
            updateGame();
            render();
            requestAnimationFrame(gameLoop);
        }
        
        function zoomIn() {
            if (camera.zoom < camera.maxZoom) {
                const oldZoom = camera.zoom;
                camera.zoom = Math.min(camera.zoom + 0.25, camera.maxZoom);
                const zoomFactor = camera.zoom / oldZoom;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                camera.x = centerX - (centerX - camera.x) * zoomFactor;
                camera.y = centerY - (centerY - camera.y) * zoomFactor;
            }
        }
        
        function zoomOut() {
            if (camera.zoom > camera.minZoom) {
                const oldZoom = camera.zoom;
                camera.zoom = Math.max(camera.zoom - 0.25, camera.minZoom);
                const zoomFactor = camera.zoom / oldZoom;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                camera.x = centerX - (centerX - camera.x) * zoomFactor;
                camera.y = centerY - (centerY - camera.y) * zoomFactor;
            }
        }
        
        function canAfford(costStr) {
            const costs = costStr.split(',');
            for (const cost of costs) {
                const [res, amount] = cost.split(':');
                if (resources[res] < parseInt(amount)) return false;
            }
            return true;
        }
        
        function deductCost(costStr) {
            const costs = costStr.split(',');
            for (const cost of costs) {
                const [res, amount] = cost.split(':');
                resources[res] -= parseInt(amount);
            }
            updateResourceDisplay();
        }
        
        function updateResourceDisplay() {
            document.getElementById('woodCount').textContent = resources.wood;
            document.getElementById('stoneCount').textContent = resources.stone;
            document.getElementById('foodCount').textContent = resources.food;
            document.getElementById('popCount').textContent = resources.pop + '/' + resources.popMax;
        }
        
        function tryBuild(e) {
            if (!selectedBuilding) return false;
            
            const tile = screenToTile(e.clientX, e.clientY);
            
            if (canBuildHere(tile.x, tile.y, selectedBuilding)) {
                const cost = document.querySelector(`[data-building="${selectedBuilding}"]`).dataset.cost;
                deductCost(cost);
                addBuilding(selectedBuilding, tile.x, tile.y);
                
                selectedBuilding = null;
                isBuildMode = false;
                document.getElementById('buildInfo').style.display = 'none';
                document.querySelectorAll('.build-item').forEach(i => i.classList.remove('selected'));
                buildMenu.classList.remove('active');
                buildMenuBtn.classList.remove('active');
                
                return true;
            } else {
                return false;
            }
        }
        
        // CHEAT: R für +100 Holz
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                resources.wood += 100;
                updateResourceDisplay();
                const cheatInfo = document.getElementById('cheatInfo');
                cheatInfo.style.display = 'block';
                setTimeout(() => {
                    cheatInfo.style.display = 'none';
                }, 1000);
            }
        });
        
        // EVENTS
        document.getElementById('minimapContainer').addEventListener('click', (e) => {
            const rect = minimapCanvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            const mapX = (clickX / 100) * MAP_WIDTH;
            const mapY = (clickY / 100) * MAP_HEIGHT;
            
            camera.x = (canvas.width / 2) - (mapX * TILE_SIZE * camera.zoom);
            camera.y = (canvas.height / 2) - (mapY * TILE_SIZE * camera.zoom);
        });
        
        const buildMenuBtn = document.getElementById('buildMenuBtn');
        const buildMenu = document.getElementById('buildMenu');
        const buildInfo = document.getElementById('buildInfo');
        
        buildMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            buildMenu.classList.toggle('active');
            buildMenuBtn.classList.toggle('active');
            if (!buildMenu.classList.contains('active')) {
                selectedBuilding = null;
                isBuildMode = false;
                buildInfo.style.display = 'none';
                document.querySelectorAll('.build-item').forEach(i => i.classList.remove('selected'));
            }
        });
        
        document.querySelectorAll('.build-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const building = e.currentTarget.dataset.building;
                const cost = e.currentTarget.dataset.cost;
                
                if (!canAfford(cost)) {
                    alert('Nicht genug Ressourcen!');
                    return;
                }
                
                if (selectedBuilding === building) {
                    selectedBuilding = null;
                    isBuildMode = false;
                    buildInfo.style.display = 'none';
                    e.currentTarget.classList.remove('selected');
                } else {
                    selectedBuilding = building;
                    isBuildMode = true;
                    document.querySelectorAll('.build-item').forEach(i => i.classList.remove('selected'));
                    e.currentTarget.classList.add('selected');
                    buildInfo.style.display = 'block';
                }
            });
        });
        
        canvas.addEventListener('mousedown', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
            
            if (selectedBuilding && isBuildMode) {
                const built = tryBuild(e);
                if (!built) {
                    isDragging = false;
                }
            } else {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                canvas.style.cursor = 'grabbing';
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
            
            if (isDragging && !selectedBuilding) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                camera.x += deltaX;
                camera.y += deltaY;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'default';
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            canvas.style.cursor = 'default';
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mousePos.x = touch.clientX;
            mousePos.y = touch.clientY;
            
            if (selectedBuilding && isBuildMode) {
                const fakeEvent = { clientX: touch.clientX, clientY: touch.clientY };
                tryBuild(fakeEvent);
            } else {
                isDragging = true;
                lastMouseX = touch.clientX;
                lastMouseY = touch.clientY;
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDragging && !selectedBuilding && e.touches.length === 1) {
                const touch = e.touches[0];
                const deltaX = touch.clientX - lastMouseX;
                const deltaY = touch.clientY - lastMouseY;
                camera.x += deltaX;
                camera.y += deltaY;
                lastMouseX = touch.clientX;
                lastMouseY = touch.clientY;
            }
        });
        
        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });
        
        document.getElementById('zoomIn').addEventListener('click', (e) => {
            e.stopPropagation();
            zoomIn();
        });
        
        document.getElementById('zoomOut').addEventListener('click', (e) => {
            e.stopPropagation();
            zoomOut();
        });
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // INIT
        generateClusteredMap();
        initTrees();
        placeHQ();
        updateResourceDisplay();
        gameLoop();
        
        console.log('Große Gebäude aktiv: HQ 3x3, Holzfäller/Farm/Haus 2x2');
        console.log('Drücke R für +100 Holz');
    </script>
</body>
</html>
